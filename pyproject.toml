[build-system]
requires = ["hatchling>=1.26,<1.32"]
build-backend = "hatchling.build"

[project]
name = "deepmedchem"
version = "0.2.0b1"
description = "Official Python client for the DeepMedChem chemical-space platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Deep MedChem"},
]
keywords = ["cheminformatics", "drug-discovery", "chemical-space", "api-client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25.3,<27",
  "platformdirs>=4.2,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
auth = []
test = [
  "build>=1.2,<2",
  "keyring>=25.3,<27",
  "pytest>=8.2,<10",
  "ruff>=0.6",
  "twine>=5,<7",
]

[project.urls]
Homepage = "https://deepmedchem.com"
Documentation = "https://docs.deepmedchem.com/docs/python/quickstart"
Repository = "https://github.com/Deep-MedChem/deepmedchem-python"
Issues = "https://github.com/Deep-MedChem/deepmedchem-python/issues"

[project.scripts]
deepmedchem = "deepmedchem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepmedchem"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
